{% extends "base.html" %}

{% block title %}Login | Intra Aura{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-box">

        <p class="auth-eyebrow">WELCOME BACK</p>

        <h1>Login</h1>

        <p class="auth-subtitle">
            Sign in to your Intra Aura account.
        </p>

        {% if request.query_params.get("error") %}
            <p class="auth-error">
                Invalid email or password.
            </p>
        {% endif %}

        <form
            method="post"
            action="/account/login"
            class="auth-form"
        >

            <div class="auth-field">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="auth-field">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button
                type="submit"
                class="auth-button"
            >
                SIGN IN
            </button>

        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="/account/register">Create Account</a>
        </p>

    </div>

</section>

{% endblock %}
